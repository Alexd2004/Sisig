# Supabase configuration for Sisig

[project]
name = "sisig"
database_major_version = "15"

[api]
enabled = true
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "storage"]
max_rows = 1000

[db]
major_version = 15
seed_file_path = "supabase/seed.sql"

[realtime]
enabled = true
max_bytes_per_second = 1000000
max_concurrent_users = 200
max_subscriptions_per_client = 200
max_joins_per_client = 5
max_push_to_db_per_second = 100

[auth]
enabled = true
email_autoconfirm = false
other_providers = ["github", "google"]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# Adds the app_role claim to access tokens (see migrations 20261028000005 and 20261028000006).
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/private/custom_access_token_hook"

[analytics]
enabled = true

