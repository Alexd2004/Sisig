name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  # Lint, typecheck, and unit tests with Turborepo caching
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for Turborepo

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Check Expo dependencies
        run: pnpm -F @sisig/mobile exec expo install --check

  # Database migrations, RLS tests, and schema linting
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: npm install -g supabase@2.122.0

      - name: Start Supabase (auto-applies migrations)
        # Image pulls from public.ecr.aws are rate-limited on shared runners.
        # Retry only on that error; any other failure fails the job right away.
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if supabase start -x realtime 2>&1 | tee "${RUNNER_TEMP}/supabase-start.log"; then
              echo "Supabase started successfully"
              exit 0
            fi
            if ! grep -q "Data limit exceeded" "${RUNNER_TEMP}/supabase-start.log"; then
              echo "supabase start failed for a non-transient reason"
              exit 1
            fi
            echo "Registry rate limit hit (attempt $attempt), retrying in 90s"
            supabase stop --no-backup || true
            sleep 90
          done
          exit 1

      - name: Wait for database to be ready
        run: |
          sleep 5
          supabase status

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pgTAP tests
        run: pnpm db:test

      - name: Lint database schema
        run: pnpm db:lint

  # TypeScript types drift check
  types-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: npm install -g supabase@2.122.0

      - name: Start Supabase (auto-applies migrations)
        # Image pulls from public.ecr.aws are rate-limited on shared runners.
        # Retry only on that error; any other failure fails the job right away.
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if supabase start -x realtime 2>&1 | tee "${RUNNER_TEMP}/supabase-start.log"; then
              echo "Supabase started successfully"
              exit 0
            fi
            if ! grep -q "Data limit exceeded" "${RUNNER_TEMP}/supabase-start.log"; then
              echo "supabase start failed for a non-transient reason"
              exit 1
            fi
            echo "Registry rate limit hit (attempt $attempt), retrying in 90s"
            supabase stop --no-backup || true
            sleep 90
          done
          exit 1

      - name: Wait for database to be ready
        run: |
          sleep 5
          supabase status

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate types
        run: pnpm db:types

      - name: Check for uncommitted type changes
        run: |
          if git diff --quiet packages/api/src/database.types.ts; then
            echo "✓ Generated types match committed types"
          else
            echo "✗ Generated types differ from committed types"
            echo "Run 'pnpm db:types' and commit the changes"
            git diff packages/api/src/database.types.ts
            exit 1
          fi

  # Secret scanning
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # grep exits 2 when a path is missing, even if it found matches elsewhere, so the
      # old `if grep ...; then` form passed silently. Scan only existing directories and
      # fail on matches or on any grep error (exit 2).
      - name: Check for service-role key in bundle
        run: |
          DIRS=""
          for d in apps/mobile/app apps/mobile/src apps/admin/src packages/api/src; do
            if [ -d "$d" ]; then DIRS="$DIRS $d"; fi
          done
          [ -n "$DIRS" ] || { echo "✗ No client source directories found"; exit 1; }
          rc=0
          MATCHES=$(grep -rl "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9" $DIRS \
            --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx") || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "✗ Service-role key or JWT pattern found in source code:"
            echo "$MATCHES"
            exit 1
          elif [ "$rc" -ne 1 ]; then
            echo "✗ grep failed with exit code $rc"
            exit "$rc"
          fi
          echo "✓ No service-role keys detected in bundle"

      - name: Check for SUPABASE_SERVICE_ROLE_KEY references
        run: |
          DIRS=""
          for d in apps/mobile/app apps/mobile/src apps/admin/src packages/api/src; do
            if [ -d "$d" ]; then DIRS="$DIRS $d"; fi
          done
          [ -n "$DIRS" ] || { echo "✗ No client source directories found"; exit 1; }
          rc=0
          MATCHES=$(grep -rl "SUPABASE_SERVICE_ROLE_KEY" $DIRS \
            --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx") || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "✗ Service role key reference found in client code:"
            echo "$MATCHES"
            exit 1
          elif [ "$rc" -ne 1 ]; then
            echo "✗ grep failed with exit code $rc"
            exit "$rc"
          fi
          echo "✓ No service-role key references in client code"
