name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  # Lint, typecheck, and unit tests. Turbo task outputs are restored from the
  # previous run's cache (CI runners do not keep .turbo/cache between runs).
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Check Expo dependencies
        run: pnpm -F @sisig/mobile exec expo install --check

  # Database migrations, RLS tests, and schema linting
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: npm install -g supabase@2.122.0

      - name: Start Supabase (auto-applies migrations)
        # Image pulls from public.ecr.aws are rate-limited on shared runners.
        # Retry only on that error; any other failure fails the job right away.
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if supabase start -x realtime 2>&1 | tee "${RUNNER_TEMP}/supabase-start.log"; then
              echo "Supabase started successfully"
              exit 0
            fi
            if ! grep -q "Data limit exceeded" "${RUNNER_TEMP}/supabase-start.log"; then
              echo "supabase start failed for a non-transient reason"
              exit 1
            fi
            echo "Registry rate limit hit (attempt $attempt), retrying in 90s"
            supabase stop --no-backup || true
            sleep 90
          done
          exit 1

      - name: Wait for database to be ready
        run: |
          sleep 5
          supabase status

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pgTAP tests
        run: pnpm db:test

      - name: Lint database schema
        run: pnpm db:lint

  # TypeScript types drift check
  types-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: npm install -g supabase@2.122.0

      - name: Start Supabase (auto-applies migrations)
        # Image pulls from public.ecr.aws are rate-limited on shared runners.
        # Retry only on that error; any other failure fails the job right away.
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if supabase start -x realtime 2>&1 | tee "${RUNNER_TEMP}/supabase-start.log"; then
              echo "Supabase started successfully"
              exit 0
            fi
            if ! grep -q "Data limit exceeded" "${RUNNER_TEMP}/supabase-start.log"; then
              echo "supabase start failed for a non-transient reason"
              exit 1
            fi
            echo "Registry rate limit hit (attempt $attempt), retrying in 90s"
            supabase stop --no-backup || true
            sleep 90
          done
          exit 1

      - name: Wait for database to be ready
        run: |
          sleep 5
          supabase status

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate types
        run: pnpm db:types

      - name: Check for uncommitted type changes
        run: |
          if git diff --quiet packages/api/src/database.types.ts; then
            echo "✓ Generated types match committed types"
          else
            echo "✗ Generated types differ from committed types"
            echo "Run 'pnpm db:types' and commit the changes"
            git diff packages/api/src/database.types.ts
            exit 1
          fi

  # Secret scanning
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Both checks use git grep over tracked files under apps/ and packages/
      # (client code, including apps/mobile/app). Exit codes: 0 = match (fail),
      # 1 = no match (pass), anything else = grep error (fail). The earlier
      # `if grep ...; then` form treated a grep error (a missing path such as
      # apps/admin/src) as "no match" and passed.
      - name: Check for service-role key or JWT pattern in client code
        run: |
          set +e
          git grep -n -I -F -e "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9" -- apps packages
          rc=$?
          set -e
          case "$rc" in
            0) echo "✗ Service-role key or JWT pattern found in client code"; exit 1 ;;
            1) echo "✓ No service-role key or JWT patterns in client code" ;;
            *) echo "✗ git grep failed with exit code $rc"; exit 1 ;;
          esac

      - name: Check for SUPABASE_SERVICE_ROLE_KEY references
        run: |
          set +e
          git grep -n -I -F -e "SUPABASE_SERVICE_ROLE_KEY" -- apps packages
          rc=$?
          set -e
          case "$rc" in
            0) echo "✗ Service role key reference found in client code"; exit 1 ;;
            1) echo "✓ No service-role key references in client code" ;;
            *) echo "✗ git grep failed with exit code $rc"; exit 1 ;;
          esac
