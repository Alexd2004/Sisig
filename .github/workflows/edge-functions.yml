name: Edge Functions

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'

jobs:
  deno-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v1
        with:
          deno-version: vx  # Latest version

      - name: Run Deno tests
        run: deno test --allow-all supabase/functions

      - name: Format check
        run: deno fmt --check supabase/functions

      - name: Lint
        run: deno lint supabase/functions
