name: Edge Functions

on:
  # No path filter on purpose: deno-tests is a required check. A path-filtered
  # workflow never reports a status on PRs that skip its paths, which leaves
  # the required check pending forever.
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  deno-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Run Deno tests
        run: deno test --allow-all --no-config supabase/functions

      - name: Format check
        run: deno fmt --check --no-config supabase/functions

      - name: Lint
        run: deno lint --no-config supabase/functions
